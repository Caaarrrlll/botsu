[workspace]
resolver = "2"
members = ["crates/botsu-core", "crates/botsu-discord", "crates/botsu-fluxer", "crates/botsu"]
# Throwaway experiments with their own Cargo.toml, lockfile and target dir.
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
botsu-core = { path = "crates/botsu-core" }
botsu-discord = { path = "crates/botsu-discord" }
botsu-fluxer = { path = "crates/botsu-fluxer" }

# Pinned exactly: fluxer-rust is 0.x and Fluxer's API is still moving.
# Bump deliberately and re-test against a live instance.
fluxer-rust = "=0.2.1"

# Gateway + REST only: no cache (saves memory), no standard_framework (deprecated).
serenity = { version = "0.12.5", default-features = false, features = ["builder", "client", "gateway", "model", "http", "rustls_backend", "voice"] }
# Discord voice, including DAVE end-to-end encryption.
songbird = "0.6.1"
# songbird builds symphonia without codecs; botsu feeds it raw f32 PCM from ffmpeg, which needs the
# PCM decoder. Without it every Discord track errors as soon as it starts.
symphonia = { version = "0.6.1", default-features = false, features = ["pcm"] }

anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same major as fluxer-rust's, so only one copy is built.
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "rustls"] }
# SQLite compiled in: no system library needed in Docker or on Windows.
rusqlite = { version = "0.43", features = ["bundled"] }
roxmltree = "0.21"
time = { version = "0.3", features = ["parsing", "formatting"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
# Small, lean binary for the Unraid container.
lto = "thin"
codegen-units = 1
strip = true

# fluxer-rust 0.2.1 with botsu's fixes (vendor/README.md). Same version, so the `=0.2.1` pin holds.
[patch.crates-io]
fluxer-rust = { path = "vendor/fluxer-rust" }
