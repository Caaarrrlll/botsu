[package]
name = "discord-voice-spike"
version = "0.0.0"
edition = "2021"
publish = false
description = "Phase 0 spike: can a bot join Discord voice (with DAVE encryption) and play audio via songbird?"

# Not part of the botsu workspace (see the root Cargo.toml `exclude`).
[workspace]

[dependencies]
serenity = { version = "0.12.5", default-features = false, features = ["builder", "cache", "client", "gateway", "model", "http", "rustls_backend", "voice"] }
songbird = "0.6.1"
# Registers the mp3 decoder with songbird's default codec registry.
symphonia = { version = "0.5", features = ["mp3"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
