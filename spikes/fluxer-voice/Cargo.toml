[package]
name = "fluxer-voice-spike"
version = "0.0.0"
edition = "2021"
publish = false
description = "Phase 0 spike: can a bot join a Fluxer voice channel (LiveKit) and play audio?"

# Not part of the botsu workspace (see the root Cargo.toml `exclude`).
[workspace]

[dependencies]
# Same pin as botsu; Cargo.lock here is a copy of the root one, so livekit/libwebrtc match too.
fluxer-rust = "=0.2.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "process"] }
serde_json = "1"
