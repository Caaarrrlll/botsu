name: Release

# Pushing a tag vX.Y.Z builds the binaries and publishes a GitHub release with them (the Docker
# image for the tag is published by ci.yml). Running it by hand (Actions → Release → Run
# workflow) only builds the files and keeps them as workflow artifacts, to try a build first.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux x86_64 (.tar.gz, .deb)
    # The oldest supported Ubuntu: the binary needs at least its glibc (2.35), so it also runs on
    # Debian 12, current Fedora and Arch.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libglib2.0-dev libva-dev libopus-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Build
        run: cargo build --release -p botsu

      - name: .deb
        run: |
          cargo install cargo-deb --locked --version 3.8.0
          # The packaged unit runs /usr/bin/botsu (the guide's manual install uses /usr/local/bin).
          sed 's#/usr/local/bin/botsu#/usr/bin/botsu#' deploy/systemd/botsu.service > target/release/botsu.service
          cargo deb -p botsu --no-build --output target/dist/
          ls -l target/dist

      - name: .tar.gz
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="dev-${GITHUB_SHA::7}"
          dir="botsu-$version-linux-x86_64"
          mkdir -p "$dir"
          cp target/release/botsu README.md LICENSE .env.example deploy/systemd/botsu.service "$dir/"
          tar -czf "target/dist/$dir.tar.gz" "$dir"

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: target/dist/*

  windows:
    name: Windows x86_64 (.zip)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      # libopus is built from source by audiopus_sys (CMake, preinstalled on the runner);
      # libwebrtc is a prebuilt download.
      - name: Build
        run: cargo build --release -p botsu

      - name: .zip
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          $dir = "botsu-$version-windows-x86_64"
          New-Item -ItemType Directory -Force $dir, dist | Out-Null
          Copy-Item target/release/botsu.exe, README.md, LICENSE, .env.example $dir
          Compress-Archive -Path $dir -DestinationPath "dist/$dir.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*

  release:
    name: GitHub release
    needs: [linux, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
