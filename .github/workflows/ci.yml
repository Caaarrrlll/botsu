name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  IMAGE: caaarrrlll/botsu

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Build deps for libwebrtc (pulled in by fluxer-rust via livekit).
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libglib2.0-dev libva-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Caches ~/.cargo and target/, including the large libwebrtc download.
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  docker:
    name: publish image
    needs: check
    # Only from master and version tags, never from pull requests.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    env:
      # Forks (or this repo before the secret is added) skip publishing instead of failing.
      PUBLISH: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: No Docker Hub token
        if: env.PUBLISH != 'true'
        run: echo "::notice::DOCKERHUB_TOKEN secret not set; skipping image publish."

      - uses: actions/checkout@v4
        if: env.PUBLISH == 'true'

      - uses: docker/setup-buildx-action@v3
        if: env.PUBLISH == 'true'

      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          username: caaarrrlll
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # latest + sha-<short> on master; 1.2.3 and 1.2 on tags v1.2.3. Also sets OCI labels
      # (source, revision, version) so Docker Hub and Unraid link back to the repo.
      - id: meta
        if: env.PUBLISH == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        if: env.PUBLISH == 'true'
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
