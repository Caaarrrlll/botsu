name: CI

on:
  push:
    # master publishes `latest`, experimental publishes `experimental` (docs/release-channels.md).
    branches: [master, experimental]
    tags: ["v*"]
    # Pushes that only touch these don't change the image, so they don't build or publish it.
    # (Tag pushes always run: GitHub ignores path filters for tags.)
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "spikes/**"
      - "deploy/**"
      - "assets/**"
      - ".github/dependabot.yml"
      - ".serena/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  IMAGE: caaarrrlll/botsu

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Build deps for libwebrtc (pulled in by fluxer-rust via livekit).
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libglib2.0-dev libva-dev libopus-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Caches ~/.cargo and target/, including the large libwebrtc download.
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  docker:
    name: image (build; publish on master, experimental and tags)
    needs: check
    # Pull requests build the image without publishing it, so Dockerfile changes are tested
    # before they reach master. Master and version tags publish.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/experimental' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    env:
      # Forks (or this repo without the secret) build but don't publish.
      PUBLISH: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Not publishing
        if: env.PUBLISH != 'true'
        run: echo "::notice::Building the image only (pull request, or DOCKERHUB_TOKEN not set)."

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          username: caaarrrlll
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # latest + sha-<short> on master; experimental + sha-<short> on experimental; 1.2.3 and 1.2
      # on tags v1.2.3. Also sets OCI labels
      # (source, revision, version) so Docker Hub and Unraid link back to the repo.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=experimental,enable=${{ github.ref == 'refs/heads/experimental' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # The Dockerfile's cargo-chef stage keeps the dependency build in its own layer, which this
      # cache keeps between runs (mode=max caches the build stages too).
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

